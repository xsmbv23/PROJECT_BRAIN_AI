name: foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run integrated deterministic foundation verifier
        run: python tools/verify_foundation.py
      - name: Run focused two-key protected-room verifier
        run: python tools/verify_access_path.py
