name: foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded runtime dependency
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Check persistent state anti-drift
        run: python tools/check_state_consistency.py
      - name: Check durable evidence TLS fail-closed rules
        run: python -m unittest tests/test_durable_postgres.py -v
      - name: Run evidence lineage validator tests
        run: python -m unittest tests/test_evidence_lineage_validator_unittest.py -v
      - name: Run lineage contract authority regression
        run: python -m unittest tests/test_evidence_lineage_contract_registry.py -v
      - name: Run source observation lineage bridge tests
        run: python -m unittest tests/test_lineage_bridge.py -v
      - name: Run integrated deterministic foundation verifier
        run: python tools/verify_foundation.py
      - name: Run focused two-key protected-room verifier
        run: python tools/verify_access_path.py
      - name: Emit repository execution receipt
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_STARTED_AT: ${{ github.run_started_at }}
        run: python tools/emit_ci_execution_receipt.py ci_execution_receipt.json
      - name: Upload repository execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: foundation-ci-execution-receipt
          path: ci_execution_receipt.json
          if-no-files-found: error
