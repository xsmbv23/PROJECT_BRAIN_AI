name: foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run foundation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run bounded foundation gate
        run: python -c "from core.foundation_gate import run_foundation_gate; r=run_foundation_gate(); print(r); raise SystemExit(0 if r['status']=='PASS' else 1)"
