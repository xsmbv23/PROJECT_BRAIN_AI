name: worker-runtime-receipt-verifier

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run worker runtime receipt tests
        run: python -m pytest -q core/worker_runtime_receipt_test.py
