name: S1 Evidence Closure Audit

on:
  push:
    branches: [main]
    paths:
      - 'core/s1_closure_audit.py'
      - 'core/s1_closure_audit_test.py'
      - 'contracts/s1_canonical_evidence_manifest.schema.json'
      - 'evidence/**'
      - 'coordination/receipts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Test S1 closure audit
        run: python -m pytest -q core/s1_closure_audit_test.py

  audit-if-manifest-exists:
    runs-on: ubuntu-latest
    needs: self-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate canonical manifest
        id: locate
        shell: bash
        run: |
          if [ -f evidence/s1_manifest.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - name: Audit S1 closure
        if: steps.locate.outputs.found == 'true'
        run: python -m core.s1_closure_audit evidence/s1_manifest.json evidence
      - name: Report missing admission manifest without claiming PASS
        if: steps.locate.outputs.found != 'true'
        run: echo 'S1 admission manifest absent; audit remains DENY/NOT-PASS by policy.'
