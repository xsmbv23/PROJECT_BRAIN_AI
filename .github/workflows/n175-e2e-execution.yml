name: N175 E2E execution verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run direct triple-worker E2E verification
        run: python orchestration/n175_e2e_runner.py
      # Direct push-triggered execution verification; no Render dependency.
      # E2E trigger nonce: 2026-08-21T23:24+07:00
