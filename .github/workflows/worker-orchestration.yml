name: Worker Orchestration

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: project-brain-worker-orchestration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governance plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate orchestration runtime
        run: python -m compileall -q orchestration/dispatch_workers.py orchestration/worker_runtime.py orchestration/worker_reconcile.py orchestration/llm_provider.py orchestration/test_llm_provider.py orchestration/v1_5a_verify.py orchestration/test_worker_v1_5c.py orchestration/v1_5e_e2e.py

      - name: Validate BOT1 allocation contract
        run: python orchestration/test_worker_v1_5c.py

      - name: Run fail-closed provider tests
        working-directory: orchestration
        run: python test_llm_provider.py

      - name: Generate pending task envelopes
        run: python orchestration/dispatch_workers.py

      - name: Claim, execute and reconcile BOT2/BOT4
        env:
          WORKERS: BOT2_QUANT,BOT4_EXECUTION
        run: python orchestration/worker_reconcile.py

      - name: Verify background path
        run: python orchestration/v1_5a_verify.py

      - name: Verify V1.5E headless continuity
        env:
          BOT2_URL: https://bot2-headless-worker.onrender.com
          BOT4_URL: https://brain-bot4-worker.onrender.com
        run: python orchestration/v1_5e_e2e.py

      - name: Persist orchestration receipts
        if: always()
        run: |
          if git diff --quiet -- coordination/worker_outbox coordination/worker_results coordination/reconciliation coordination/receipts; then
            echo "No orchestration changes."
            exit 0
          fi
          git config user.name "Project Brain Worker Orchestrator"
          git config user.email "actions@users.noreply.github.com"
          git add coordination/worker_outbox coordination/worker_results coordination/reconciliation coordination/receipts
          git commit -m "orchestration: persist worker cycle receipts"
          git push
