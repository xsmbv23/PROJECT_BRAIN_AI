name: Worker Orchestration

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: project-brain-worker-orchestration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governance plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate orchestration runtime
        run: python -m compileall -q orchestration/dispatch_workers.py orchestration/worker_runtime.py orchestration/worker_reconcile.py

      - name: Generate pending task envelopes
        run: python orchestration/dispatch_workers.py

      - name: Claim, execute and reconcile BOT2/BOT4
        env:
          WORKERS: BOT2_QUANT,BOT4_EXECUTION
        run: python orchestration/worker_reconcile.py

      - name: Persist orchestration receipts
        run: |
          if git diff --quiet -- coordination/worker_outbox coordination/worker_results; then
            echo "No orchestration changes."
            exit 0
          fi
          git config user.name "Project Brain Worker Orchestrator"
          git config user.email "actions@users.noreply.github.com"
          git add coordination/worker_outbox coordination/worker_results
          git commit -m "orchestration: reconcile worker leases and results"
          git push
