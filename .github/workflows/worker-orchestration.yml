name: Worker Orchestration

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: project-brain-worker-orchestration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout governance plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dispatch pending worker tasks
        run: python orchestration/dispatch_workers.py

      - name: Persist generated task envelopes
        run: |
          if git diff --quiet -- coordination/worker_outbox; then
            echo "No new worker envelopes."
            exit 0
          fi
          git config user.name "Project Brain Worker Orchestrator"
          git config user.email "actions@users.noreply.github.com"
          git add coordination/worker_outbox
          git commit -m "orchestration: dispatch worker tasks"
          git push
